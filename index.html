<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d4a">
<title>花語寶石園</title>
<link rel="icon" href="a/g0.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- game layout -->
  <div id="scene">
    <div id="sceneBg"></div>
    <div id="sceneItems"></div>
    <canvas id="fx"></canvas>
  </div>
  <div id="hud">
    <div class="pill" id="lvPill">第 1 關</div>
    <div class="pill" id="movesPill"><span class="sm">步數</span> <b id="moves">25</b></div>
    <button class="iconBtn" id="btnMenu" aria-label="選單">⚙️</button>
  </div>
  <div id="goals"></div>
  <div id="boost"></div>
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="tray">
    <div id="meter"><div id="meterFill"></div><span id="meterTxt">能量</span></div>
    <div id="slots"></div>
  </div>
  <div id="mascot"><img id="mascotImg" alt=""><div id="bubble"></div></div>
  <div id="floaters"></div>
  <div id="mergeTip"></div><div id="finger">👆</div>

  <!-- screens -->
  <div id="title" class="screen show">
    <div class="titleBg"></div>
    <div class="logo"><div class="l1">花語寶石園</div><div class="l2">Gem Blossom Garden</div></div>
    <div class="titleChars"><img src="a/ch_fox.png"><img src="a/ch_panda.png"><img src="a/ch_bunny.png"></div>
    <button class="big glow" id="btnStart">點一下 開始</button>
  </div>

  <div id="select" class="screen">
    <h1>選擇你的夥伴</h1>
    <div id="cards"></div>
  </div>

  <div id="home" class="screen">
    <div class="amb"><div class="ray"></div><div class="ray r2"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="bfly"><span>🦋</span></div><div class="bfly b2"><span>🦋</span></div><div class="bfly b3"><span>🐦</span></div><i class="spk" style="left:12%;top:40%"></i><i class="spk" style="left:70%;top:30%;animation-delay:-1s"></i><i class="spk" style="left:40%;top:62%;animation-delay:-2s"></i><i class="spk" style="left:85%;top:55%;animation-delay:-1.5s"></i></div>
    <div class="homeTop"><div class="pill" id="starPill">⭐ 0</div><div class="pill" id="coinPill"><img class="ci" src="a/coin.png" alt="">0</div><button class="iconBtn" id="btnSet2">⚙️</button></div>
    <div class="homeMid">
      <img id="homeChar" class="breathe">
      <div id="homeName"></div>
      <div id="homeCh"></div>
    </div>
    <div class="homeBtns">
      <button class="big glow" id="btnPlay">開始 第 1 關</button>
      <div class="row2"><button class="big alt" id="btnMap">🗺️ 關卡地圖</button><button class="big alt" id="btnFarm">🐔 開心農場</button></div>
      <button class="big alt" id="btnGarden">🌷 逛逛花園</button>
    </div>
  </div>

  <div id="gardenBar" class="hidden"><div id="gTopBar"><div class="gTip" id="gTip">點點花園裡的東西和小動物吧！</div><div id="gStore" class="store hidden"></div></div><div id="gBotBar"><div class="gBtns"><button class="big glow" id="btnGEdit">✋ 佈置花園</button><button class="big alt" id="btnGardenBack">← 回去</button></div></div></div>

  <div id="video" class="screen">
    <video id="vid" playsinline muted webkit-playsinline preload="auto"></video>
    <div id="vidText"></div>
    <button class="big glow" id="vidBtn">繼續 ▶</button>
  </div>

  <div id="map" class="screen">
    <div class="mapTop"><button class="big alt sm" id="mapBack">← 回去</button><div class="mt">關卡地圖</div><div class="pill" id="mapStars"></div></div>
    <div id="mapList"></div>
  </div>

  <div id="farm" class="screen">
    <div class="fbg"></div>
    <div class="fwrap">
      <div class="ftop"><button class="big alt sm" id="fBack">← 回去</button><div class="pill" id="fCoins"><img class="ci" src="a/coin.png" alt="">0</div><button class="big glow sm" id="fShop">🛒 商店</button></div>
      <div class="fhead"><img id="fChar"><div id="fSay"></div></div>
      <div class="fsec" id="fYardSec"><div class="ftitle yardT"><span>🏡 我的小院子</span><button class="big sm" id="fEdit">✋ 佈置</button></div><div id="fTip" class="hidden">👆 按住拖曳移動，拖到收納箱就收起來</div><div id="fStore" class="store hidden"></div><div id="fYard"></div><div id="fDecos" class="hidden"></div></div>
      <div class="fsec"><div class="ftitle">🐔 動物（點一下收集）</div><div id="fAnimals"></div></div>
      <div class="fsec"><div class="ftitle">🌱 農田（作物離線也會長）</div><div id="fPlots"></div></div>
      <div class="fsec"><div class="ftitle">倉庫・道具</div><div id="fInv"></div></div>
    </div>
  </div>

  <div id="ending" class="screen">
    <div class="endBg"></div>
    <div class="endBox">
      <div class="l1">🎉 恭喜通關！</div>
      <div class="endChars"><img src="a/ch_fox.png"><img src="a/ch_panda.png"><img src="a/ch_bunny.png"></div>
      <p>五個花園都恢復美麗了！<br>謝謝你一路的陪伴 💖</p>
      <div class="pill" id="endStars"></div>
      <div class="row"><button class="big glow" id="endFarm">🐔 去農場</button><button class="big alt" id="endMap">🗺️ 重玩關卡</button></div>
      <div class="row"><button class="big alt" id="endHome">回首頁</button></div>
    </div>
  </div>

  <div id="modal" class="screen"><div class="panel" id="panel"></div></div>
</div>
<script src="analytics.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
<script src="farm.js"></script>
<script src="deco.js"></script>
<script>
$("#mapBack").onclick=()=>goHome();$("#fBack").onclick=()=>goHome();$("#fShop").onclick=()=>openShop();
$("#endFarm").onclick=()=>openFarm();$("#endMap").onclick=()=>openMap();$("#endHome").onclick=()=>goHome();
GBGStats&&GBGStats.trackVisit&&GBGStats.trackVisit();
</script>
</body>
</html>
