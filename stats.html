<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d4a">
<title>花語寶石園 · 每日人數</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(165deg,#2b1d4a,#4a2d6e 50%,#1a1040);color:#fff;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));}
h1{font-size:clamp(28px,7vw,40px);text-align:center;margin:8px 0 4px;letter-spacing:.04em}
.sub{text-align:center;opacity:.85;font-size:clamp(16px,4vw,20px);margin-bottom:18px}
.total{background:rgba(255,255,255,.12);border:2px solid rgba(255,220,120,.55);border-radius:18px;padding:18px;text-align:center;margin:0 auto 22px;max-width:520px}
.total .lbl{font-size:clamp(18px,4.5vw,22px);opacity:.9}
.total .num{font-size:clamp(48px,14vw,72px);font-weight:800;color:#ffe08a;line-height:1.1;margin-top:4px}
.list{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;font-size:clamp(20px,5vw,26px)}
.row .d{font-weight:600;letter-spacing:.02em}
.row .c{font-weight:800;color:#b8f5c5;font-size:clamp(26px,7vw,34px)}
.row.today{border:2px solid #ffe08a;background:rgba(255,224,138,.15)}
.err,.load{text-align:center;font-size:22px;padding:24px;opacity:.9}
.note{text-align:center;margin-top:20px;font-size:14px;opacity:.65;line-height:1.5}
a.back{display:inline-block;margin:0 auto 12px;color:#ffe08a;font-size:18px;text-decoration:none}
.wrap{text-align:center}
</style>
</head>
<body>
<div class="wrap"><a class="back" href="./">← 回遊戲</a></div>
<h1>每日遊玩人數</h1>
<p class="sub">最近 30 天 · 同一裝置每天只算一次<br>（不含作者自己的裝置）</p>
<div id="box" class="load">讀取中…</div>
<p class="note">台灣時間計算日期 · 僅統計網頁版<br>打開本頁不會增加計數</p>
<script src="analytics.js"></script>
<script>
(async function(){
  const box=document.getElementById('box');
  try{
    const {days,total}=await GBGStats.loadStats(30);
    const today=GBGStats.twYmd();
    function fmt(ymd){return ymd.slice(0,4)+'/'+ymd.slice(4,6)+'/'+ymd.slice(6,8);}
    let html='<div class="total"><div class="lbl">30 天合計</div><div class="num">'+total+'</div></div><div class="list">';
    days.forEach(d=>{
      const cls=d.ymd===today?'row today':'row';
      html+='<div class="'+cls+'"><span class="d">'+fmt(d.ymd)+(d.ymd===today?' · 今天':'')+'</span><span class="c">'+d.count+'</span></div>';
    });
    html+='</div>';
    box.innerHTML=html;
  }catch(e){
    box.className='err';
    box.textContent='讀取失敗，請稍後再試';
  }
})();
</script>
</body>
</html>
